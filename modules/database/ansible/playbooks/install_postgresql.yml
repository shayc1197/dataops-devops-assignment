---
- name: Install and Configure PostgreSQL with CDC
  hosts: all
  gather_facts: yes

  pre_tasks:
    - name: Wait for system to be ready
      wait_for_connection:
        delay: 10
        timeout: 300

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      become: true

  roles:
    - ../postgresql

  post_tasks:
    - name: Show PostgreSQL status
      shell: systemctl status postgresql
      register: pg_status
      failed_when: false

    - name: Show status output
      debug:
        var: pg_status.stdout_lines
