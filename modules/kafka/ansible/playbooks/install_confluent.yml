---
- name: Install and Configure Confluent Platform
  hosts: all
  gather_facts: yes

  roles:
    - ../kafka

  post_tasks:
    - name: Display Confluent Control Center URL
      debug:
        msg: "Confluent Control Center available at http://{{ ansible_default_ipv4.address }}:9021"

    - name: Display Kafka broker endpoint
      debug:
        msg: "Kafka Broker: {{ ansible_default_ipv4.address }}:9092"

    - name: Display Kafka Connect endpoint
      debug:
        msg: "Kafka Connect: {{ ansible_default_ipv4.address }}:8083"
