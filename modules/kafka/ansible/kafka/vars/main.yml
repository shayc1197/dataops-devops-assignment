---
confluent_version: "7.6.1"
confluent_home: "/opt/confluent"
confluent_user: "confluent"
confluent_group: "confluent"

# Database connection for Debezium connector
database_private_ip: "10.0.10.110"  # Default value - overridden by Terraform -e variable at runtime

kafka_topic_name: "cdc.orders"
kafka_topic_partitions: 3
kafka_topic_replication_factor: 1

kafka_connect_iceberg_plugin_dir: "/opt/confluent/share/java/kafka-connect-iceberg"
kafka_connect_debezium_plugin_dir: "/opt/confluent/share/java/kafka-connect-debezium"
kafka_connect_iceberg_config_dir: "/opt/confluent/etc/kafka-connect-iceberg"
iceberg_connector_jar_url: "https://github.com/tabular-io/iceberg-kafka-connect/releases/download/v0.6.19/iceberg-kafka-connect-runtime-0.6.19.zip"
iceberg_connector_jar_name: "iceberg-kafka-connect-runtime-0.6.19.zip"
debezium_connector_jar_url: "https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/2.4.0.Final/debezium-connector-postgres-2.4.0.Final-plugin.zip"
debezium_connector_jar_name: "debezium-connector-postgres-2.4.0.Final-plugin.zip"
iceberg_connector_name: "iceberg-sink-orders"
iceberg_table_namespace: "default"
iceberg_table_name: "orders"
aws_region: "eu-central-1"
s3tables_table_bucket_arn: ""
s3tables_rest_endpoint: "https://s3tables.{{ aws_region }}.amazonaws.com/iceberg"

# Debezium PostgreSQL connector
debezium_connector_name: "debezium-postgres-orders"
debezium_postgres_host: "{{ database_private_ip }}"
debezium_postgres_port: 5432
debezium_postgres_user: "postgres"
debezium_postgres_password: "postgres"
debezium_postgres_db: "ordersdb"
debezium_postgres_slot_name: "debezium_slot"
